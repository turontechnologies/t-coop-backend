spring:
  application:
    name: t-coop-backend

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver

  jpa:
    hibernate:
      # Flyway owns the schema — Hibernate only ever validates it matches
      # the entities, it never auto-generates or alters tables itself.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.SQLServerDialect

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

server:
  port: ${SERVER_PORT:8080}

# Comma-separated list of origins allowed to call this API (e.g. the
# Vercel-deployed frontend). See config.CorsConfig.
app:
  cors:
    allowed-origins: ${FRONTEND_ORIGINS:http://localhost:3000}
  cloudinary:
    cloud-name: ${CLOUDINARY_CLOUD_NAME:}
    api-key: ${CLOUDINARY_API_KEY:}
    api-secret: ${CLOUDINARY_API_SECRET:}
  jwt:
    # Must be set explicitly (no default) — a real, random secret, at least
    # 32 characters. Generate one with e.g. `openssl rand -base64 32`.
    secret: ${JWT_SECRET}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:60}
